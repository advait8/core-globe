<!DOCTYPE html>
<html>
<head>
<style>body{margin:0} #globe{width:100vw;height:100vh}</style>
<!-- The ES build imports 'three' as a bare specifier (peer dependency, not bundled) — an
     import map is what lets a plain browser (no bundler) resolve that to an actual URL. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>
  <div id="globe"></div>
  <script type="module">
    import { Globe } from './dist/core-globe.es.js';

    const globe = new Globe({
      container: document.getElementById('globe'),
      // test.html is served from the npm/ package root, but the built data files live
      // under dist/data/ (see vite.config.ts) — override the './data/' default accordingly.
      dataBaseUrl: './dist/data/',
      onMarkerClick: id => console.log('Marker clicked:', id),
      onArcAnimationComplete: arcId => console.log('Arc animation complete:', arcId),
      onFlightComplete: () => console.log('Flight complete'),
      onReady: () => console.log('Globe ready'),
    });

    globe.addMarker({ id: 'lon', lat: 51.5, lng: -0.12, style: 'current', label: 'London' });
    globe.addMarker({ id: 'tok', lat: 35.68, lng: 139.69, style: 'destination', label: 'Tokyo' });
    globe.addMarker({ id: 'syd', lat: -33.87, lng: 151.21, style: { color: '#7ED6A5', pulse: true }, label: 'Sydney' });

    globe.addArc({ id: 'lon-tok', from: { lat: 51.5, lng: -0.12 }, to: { lat: 35.68, lng: 139.69 }, style: 'flight', progress: 0 });
    globe.addArc({ id: 'lon-syd', from: { lat: 51.5, lng: -0.12 }, to: { lat: -33.87, lng: 151.21 }, style: 'dashed' });

    globe.animateArc('lon-tok');

    setTimeout(() => {
      globe.animateFlight({ lat: 35.68, lng: 139.69 }, { lat: 51.5, lng: -0.12 });
    }, 2500);
  </script>
</body>
</html>
